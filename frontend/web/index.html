<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="AI 도슨트와 그림을 이야기하고 감상의 순간을 기록하는 나만의 미술관, Docentalk.">
  <meta name="application-name" content="Docentalk">
  <meta property="og:title" content="Docentalk · 그림과 나누는 대화">
  <meta property="og:description" content="AI 도슨트와 작품을 만나고, 나만의 감상과 컬렉션을 모아보세요.">
  <meta property="og:type" content="website">
  <link rel="icon" href="docentalk-favicon-v2.png" type="image/png">
  <link rel="apple-touch-icon" href="docentalk-favicon-v2.png">
  <link rel="manifest" href="manifest.json">
  <title>Docentalk · 일상에 한 점</title>
  <style>
    @font-face{font-family:ChironSungHK;src:url('assets/assets/fonts/ChironSungHK-Web.ttf') format('truetype');font-weight:200 900;font-display:swap}
    html,body{margin:0;background:#f8f7f4;height:100%;color:#252823}
    #loading{height:100%;display:grid;place-content:center;text-align:center;font:14px ChironSungHK,serif;gap:15px}

  <div id="loading" role="status"><div class="logo"><img src="assets/assets/branding/docentalk-lockup.png" alt="Docentalk"></div><span>그림을 만날 준비를 하고 있어요.</span></div>
