# Railway config for the backend API service. The frontend is on Vercel.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/backend.Dockerfile"
# Frontend-only or docs-only pushes do not redeploy the API.
watchPatterns = ["backend/**", "pyproject.toml", "uv.lock", "infra/backend.Dockerfile"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
