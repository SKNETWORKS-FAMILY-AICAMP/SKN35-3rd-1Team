[project]
name = "skn35-3rd-1team"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "firebase-admin>=7.7.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "mcp>=1.26,<2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
    "tidb-vector>=0.0.15",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
src = ["backend"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
