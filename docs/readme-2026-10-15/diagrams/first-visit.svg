<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520">
<style>text{font-family:Arial,"Apple SD Gothic Neo",sans-serif;fill:#252823;font-size:16px}.h{font-size:24px;font-weight:bold}.w{fill:white}.s{font-size:14px;fill:#657064}</style>
<rect width="1440" height="520" fill="#f8f7f4"/><text x="40" y="49" class="h">첫 방문부터 나의 감상까지 · 로그인 전·후 흐름</text>
<g transform="translate(40,90)"><rect width="400" height="380" rx="10" fill="white" stroke="#d3d6cf"/><rect width="400" height="44" fill="#111"/><text x="20" y="28" class="w">01  자유롭게 둘러보기</text><rect x="20" y="65" width="360" height="120" fill="#eef0eb"/><text x="40" y="130">오늘의 그림 · 작품·작가 탐색</text><text x="20" y="222">작품 상세 → 도슨트 질문 → 출처 확인</text><text x="20" y="260" class="s">공개 감상 피드는 로그인 없이 읽기</text><rect x="20" y="302" width="360" height="48" rx="6" fill="#252823"/><text x="99" y="332" class="w">내 기록을 남기려면 로그인</text></g>
<path d="M455 270h45l-10-9m10 9-10 9" fill="none" stroke="#879188" stroke-width="2"/>
<g transform="translate(520,90)"><rect width="400" height="380" rx="10" fill="white" stroke="#d3d6cf"/><rect width="400" height="44" fill="#111"/><text x="20" y="28" class="w">02  로그인 / 회원가입</text><text x="20" y="87">로그인      회원가입</text><rect x="20" y="110" width="360" height="42" rx="5" fill="#eef0eb"/><text x="112" y="137">Google로 계속하기</text><rect x="20" y="174" width="360" height="42" rx="5" fill="#fafaf8" stroke="#d3d6cf"/><text x="35" y="201" class="s">이메일</text><rect x="20" y="232" width="360" height="42" rx="5" fill="#fafaf8" stroke="#d3d6cf"/><text x="35" y="259" class="s">비밀번호</text><text x="20" y="310" class="s">비밀번호 재설정 / 로그인·가입 구분</text><text x="20" y="346" class="s">개인 기록은 로그인한 계정에 연결</text></g>
<path d="M935 270h45l-10-9m10 9-10 9" fill="none" stroke="#879188" stroke-width="2"/>
<g transform="translate(1000,90)"><rect width="400" height="380" rx="10" fill="white" stroke="#d3d6cf"/><rect width="400" height="44" fill="#111"/><text x="20" y="28" class="w">03  나의 감상과 취향</text><text x="20" y="88">프로필 · AI 한 줄 소개</text><rect x="20" y="112" width="360" height="48" rx="5" fill="#eef0eb"/><text x="35" y="142">공개 감상 / 비공개 기록</text><rect x="20" y="175" width="360" height="48" rx="5" fill="#eef0eb"/><text x="35" y="205">컬렉션 · 좋아요 · 관심 작가</text><rect x="20" y="238" width="360" height="48" rx="5" fill="#eef0eb"/><text x="35" y="268">감상 캘린더 · 날짜별 작품</text><text x="20" y="330" class="s">AI 취향 테마와 추천으로 다음 작품 발견</text></g></svg>
